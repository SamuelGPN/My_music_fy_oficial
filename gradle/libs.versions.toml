[versions]
agp = "8.9.2"
junit = "4.13.2"
junitVersion = "1.2.1"
espressoCore = "3.6.1"
appcompat = "1.7.0"
material = "1.12.0"
activity = "1.10.1"
constraintlayout = "2.2.1"
ffmpeg = "1.0.14"
chaquopy = "16.0.0"
media3Session = "1.7.1"
media3Exoplayer = "1.7.1"
media3Ui = "1.7.1"
#ffmpegkit = "v6.0.LTS"

[libraries]
junit = { group = "junit", name = "junit", version.ref = "junit" }
ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
ffmpeg = {group = "com.github.wseemann", name = "FFmpegMediaMetadataRetriever", version.ref = "ffmpeg"}
media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3Session" }
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3Exoplayer" }
media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3Ui" }
#ffmpegkit = {group = "com.github.arthenica", name = "ffmpeg-kit-full", version.ref = "ffmpegkit"}

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
chaquopy = {id = "com.chaquo.python", version.ref = "chaquopy" }

